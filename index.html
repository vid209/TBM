<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANK BRAWL</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            touch-action: none;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }
        .menu {
            background: #1e2a1c;
            border: 3px solid #e9b45e;
            border-radius: 32px;
            padding: 20px;
            max-width: 420px;
            width: 92%;
            text-align: center;
        }
        .menu h1 { font-size: 1.6rem; color: #f7e9c3; margin: 0 0 15px; }
        .mode-btn {
            background: #2f3a28;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            color: #ffeaac;
            font-family: monospace;
            width: 100%;
            margin: 6px 0;
            touch-action: manipulation;
        }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn.bots { background: #3a6e3a; }
        .mode-btn.ctf { background: #2a6e5a; }
        .mode-btn.pvp { background: #8b5a2a; }
        .mode-btn.online { background: #3a5a8a; }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 4px;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 6px 16px;
            background: #1e1b14cc;
            border-radius: 30px;
            color: #f7ecc7;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        canvas {
            box-shadow: 0 0 0 3px #ab8743, 0 10px 25px black;
            border-radius: 14px;
            width: 100%;
            height: auto;
            max-width: 800px;
            touch-action: none;
            background: #2d2a24;
            flex-shrink: 0;
        }
        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 8px 12px;
            margin-top: 6px;
            flex-shrink: 0;
            gap: 12px;
            background: #1a1a14aa;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 4px;
            touch-action: none;
        }
        .dpad-btn {
            background: #2c241a;
            border: 2px solid #b99a4a;
            border-radius: 16px;
            color: #ffeaac;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #5a3a1a;
        }
        .dpad-btn:active { transform: scale(0.93); box-shadow: 0 1px 0 #5a3a1a; }
        .dpad-center {
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
            color: #5a5a4a;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .fire-btn {
            background: #8b2a1a;
            border: 3px solid #ff6644;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a150a;
        }
        .fire-btn:active { transform: scale(0.92); box-shadow: 0 1px 0 #4a150a; }
        .small-btn {
            background: #3a5a3a;
            border: 2px solid #88aa44;
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffeaac;
            font-size: 0.7rem;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            font-family: monospace;
            width: 80px;
        }
        .small-btn:active { transform: scale(0.95); }
        .back-btn {
            background: #5a4a2e;
            border: 2px solid #b99a4a;
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffeaac;
            font-size: 0.7rem;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            font-family: monospace;
            width: 80px;
        }
        .back-btn:active { transform: scale(0.95); }
        .network-panel {
            background: #0e180c;
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
        }
        .network-panel input {
            background: #2c2a1c;
            border: 2px solid #b99a4a;
            padding: 10px;
            border-radius: 30px;
            font-family: monospace;
            color: #ffeaaf;
            font-size: 0.9rem;
            width: 100%;
            margin: 5px 0;
            text-align: center;
        }
        .network-panel button {
            background: #3a5a8a;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            color: white;
            font-family: monospace;
            width: 100%;
            margin: 5px 0;
        }
        .network-panel button:active { transform: scale(0.97); }
        .status-text {
            color: #cfc68f;
            font-size: 0.7rem;
            margin-top: 8px;
            text-align: center;
        }
        @media (min-width: 860px) {
            .touch-controls { display: none; }
        }
        @media (max-width: 550px) {
            .dpad { grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 3px; }
            .dpad-btn { font-size: 1.4rem; border-radius: 12px; }
            .fire-btn { width: 65px; height: 65px; font-size: 1.8rem; }
            .small-btn, .back-btn { width: 65px; font-size: 0.6rem; padding: 4px 10px; }
            .info { font-size: 0.7rem; padding: 4px 12px; }
        }
        @media (max-width: 400px) {
            .dpad { grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; gap: 2px; }
            .dpad-btn { font-size: 1rem; border-radius: 10px; }
            .fire-btn { width: 55px; height: 55px; font-size: 1.4rem; }
            .small-btn, .back-btn { width: 55px; font-size: 0.5rem; padding: 3px 6px; }
            .info { font-size: 0.6rem; padding: 3px 8px; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="menu" class="menu">
    <h1>⚡ TANK BRAWL ⚡</h1>
    <button class="mode-btn bots" data-mode="bots">🎮 ОФЛАЙН (против ботов)</button>
    <button class="mode-btn ctf" data-mode="ctf">🏁 ЗАХВАТ ФЛАГА</button>
    <button class="mode-btn pvp" data-mode="pvp">⚔️ PVP 2 ИГРОКА</button>
    <button class="mode-btn online" data-mode="online">🌐 ПО СЕТИ</button>
    <div id="networkPanel" class="network-panel hidden">
        <input type="text" id="serverIp" placeholder="IP сервера (localhost)" value="localhost">
        <input type="text" id="serverPort" placeholder="Порт" value="8080">
        <button id="connectBtn">🔌 ПОДКЛЮЧИТЬСЯ</button>
        <div class="status-text" id="netStatus">Введите IP сервера и нажмите подключиться</div>
    </div>
</div>

<div id="game" class="game-container hidden">
    <div class="info">
        <span>❤️ <span id="healthValue">3</span></span>
        <span>⭐ <span id="scoreValue">0</span></span>
        <span id="modeLabel">🎮 РЕЖИМ</span>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="touch-controls" id="touchControls">
        <div class="dpad">
            <div class="dpad-btn" id="btnUp">▲</div>
            <div class="dpad-btn" id="btnLeft">◀</div>
            <div class="dpad-btn dpad-center">+</div>
            <div class="dpad-btn" id="btnRight">▶</div>
            <div class="dpad-btn" id="btnDown">▼</div>
        </div>
        <div class="action-buttons">
            <button class="fire-btn" id="btnFire">💥</button>
            <button class="small-btn" id="btnRestart">🔄 R</button>
            <button class="back-btn" id="backBtn">🏠 МЕНЮ</button>
        </div>
    </div>
    <div id="onlineStatus" class="status-text" style="margin-top:4px;color:#88aa44;"></div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // ========== ПЕРЕМЕННЫЕ ==========
    let currentMode = null;
    let gameRunning = false;
    let gameOver = false;
    let score = 0;
    let bricks = [];
    let ws = null;
    let myId = null;
    let players = new Map();
    let lastSend = 0;
    
    let p1 = { x: 380, y: 520, w: 40, h: 40, dir: 0, health: 3 };
    let p1Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
    let p1Delay = 0;
    
    let p2 = null;
    let p2Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
    let p2Delay = 0;
    
    let enemies = [];
    let flag = { x: 700, y: 80, w: 28, h: 28, captured: false, carrier: null };
    
    const keys = { left: false, right: false, up: false, down: false, fire: false };
    const keysP2 = { left: false, right: false, up: false, down: false, fire: false };
    
    // ========== ПОСТРОЕНИЕ СТЕН ==========
    function buildBricks() {
        let arr = [];
        for (let i = 0; i < 20; i++) {
            arr.push({ x: i * 42, y: 0, w: 38, h: 38 });
            arr.push({ x: i * 42, y: 562, w: 38, h: 38 });
        }
        for (let i = 0; i < 15; i++) {
            arr.push({ x: 0, y: i * 42, w: 38, h: 38 });
            arr.push({ x: 762, y: i * 42, w: 38, h: 38 });
        }
        for (let i = 3; i < 18; i += 4) {
            for (let j = 4; j < 10; j += 2) {
                arr.push({ x: i * 42, y: j * 42, w: 38, h: 38 });
            }
        }
        return arr;
    }
    
    function collide(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }
    
    function updateUI() {
        document.getElementById('healthValue').innerText = p1.health;
        document.getElementById('scoreValue').innerText = score;
    }
    
    // ========== РЕСТАРТ ==========
    function restart() {
        gameOver = false;
        score = 0;
        p1 = { x: 380, y: 520, w: 40, h: 40, dir: 0, health: 3 };
        p1Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
        p1Delay = 0;
        bricks = buildBricks();
        flag = { x: 700, y: 80, w: 28, h: 28, captured: false, carrier: null };
        players.clear();
        
        if (currentMode === 'pvp') {
            p2 = { x: 380, y: 80, w: 40, h: 40, dir: 1, health: 3 };
            p2Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
            p2Delay = 0;
            enemies = [];
        } else if (currentMode === 'bots' || currentMode === 'ctf') {
            p2 = null;
            enemies = [];
            for (let i = 0; i < 3; i++) {
                enemies.push({ x: 100 + i * 250, y: 80, w: 40, h: 40, dir: 1, moveTimer: 0, shootTimer: Math.floor(Math.random() * 50) });
            }
        }
        updateUI();
    }
    
    // ========== ДВИЖЕНИЕ ТАНКА ==========
    function moveTank(tank, dx, dy, newDir, isP1) {
        let newX = tank.x + dx;
        let newY = tank.y + dy;
        if (newX < 2) newX = 2;
        if (newX > 758) newX = 758;
        if (newY < 2) newY = 2;
        if (newY > 558) newY = 558;
        let oldX = tank.x, oldY = tank.y;
        tank.x = newX;
        tank.y = newY;
        tank.dir = newDir;
        
        for (let b of bricks) {
            if (collide({x: tank.x, y: tank.y, w: 40, h: 40}, b)) {
                tank.x = oldX;
                tank.y = oldY;
                break;
            }
        }
        
        if (currentMode === 'pvp' && p2 && collide({x: p1.x, y: p1.y, w: 40, h: 40}, {x: p2.x, y: p2.y, w: 40, h: 40})) {
            tank.x = oldX;
            tank.y = oldY;
        }
    }
    
    // ========== СТРЕЛЬБА ==========
    function shoot(tank, bullet, isP1) {
        if (bullet.active) return;
        if (isP1 && p1Delay > 0) return;
        if (!isP1 && p2Delay > 0) return;
        
        if (isP1) p1Delay = 15;
        else p2Delay = 15;
        
        bullet.active = true;
        if (tank.dir === 0) {
            bullet.x = tank.x + 16; bullet.y = tank.y;
            bullet.speedX = 0; bullet.speedY = -8;
        } else if (tank.dir === 1) {
            bullet.x = tank.x + 16; bullet.y = tank.y + 40;
            bullet.speedX = 0; bullet.speedY = 8;
        } else if (tank.dir === 2) {
            bullet.x = tank.x; bullet.y = tank.y + 16;
            bullet.speedX = -8; bullet.speedY = 0;
        } else {
            bullet.x = tank.x + 40; bullet.y = tank.y + 16;
            bullet.speedX = 8; bullet.speedY = 0;
        }
        
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'shoot', bullet: bullet, dir: tank.dir }));
        }
    }
    
    // ========== ОБНОВЛЕНИЕ ПУЛИ ==========
    function updateBullet(bullet, isP1Bullet) {
        if (!bullet.active) return;
        bullet.x += bullet.speedX;
        bullet.y += bullet.speedY;
        if (bullet.x < -50 || bullet.x > 850 || bullet.y < -50 || bullet.y > 650) {
            bullet.active = false;
            return;
        }
        let bulletRect = { x: bullet.x, y: bullet.y, w: 8, h: 8 };
        
        for (let i = 0; i < bricks.length; i++) {
            if (collide(bulletRect, bricks[i])) {
                bricks.splice(i, 1);
                bullet.active = false;
                if (isP1Bullet) { score += 10; updateUI(); }
                return;
            }
        }
        
        if (currentMode === 'pvp' && p2 && collide(bulletRect, {x: p2.x, y: p2.y, w: 40, h: 40})) {
            p2.health--;
            bullet.active = false;
            if (isP1Bullet) { score += 50; updateUI(); }
            if (p2.health <= 0) { score += 200; updateUI(); gameOver = true; }
            return;
        }
        
        for (let [id, player] of players) {
            if (collide(bulletRect, {x: player.x, y: player.y, w: 40, h: 40})) {
                player.health--;
                bullet.active = false;
                if (isP1Bullet) { score += 50; updateUI(); }
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'damage', targetId: id, health: player.health }));
                }
                if (player.health <= 0) {
                    players.delete(id);
                    score += 200;
                    updateUI();
                }
                return;
            }
        }
        
        for (let i = 0; i < enemies.length; i++) {
            if (collide(bulletRect, {x: enemies[i].x, y: enemies[i].y, w: 40, h: 40})) {
                enemies.splice(i, 1);
                bullet.active = false;
                if (isP1Bullet) { score += 100; updateUI(); }
                return;
            }
        }
    }
    
    // ========== БОТЫ ==========
    function updateEnemies() {
        for (let i = 0; i < enemies.length; i++) {
            let e = enemies[i];
            e.moveTimer++;
            e.shootTimer++;
            if (e.moveTimer > 50) { e.moveTimer = 0; e.dir = Math.floor(Math.random() * 4); }
            let oldX = e.x, oldY = e.y;
            if (e.dir === 0) e.y -= 2;
            if (e.dir === 1) e.y += 2;
            if (e.dir === 2) e.x -= 2;
            if (e.dir === 3) e.x += 2;
            if (e.x < 2) e.x = 2;
            if (e.x > 758) e.x = 758;
            if (e.y < 2) e.y = 2;
            if (e.y > 400) e.y = 400;
            for (let b of bricks) {
                if (collide({x: e.x, y: e.y, w: 40, h: 40}, b)) { e.x = oldX; e.y = oldY; break; }
            }
            if (e.shootTimer > 45) {
                e.shootTimer = 0;
                let eb = { x: 0, y: 0, w: 8, h: 8, speedX: 0, speedY: 0 };
                if (e.dir === 0) { eb.x = e.x+16; eb.y = e.y; eb.speedX = 0; eb.speedY = -6; }
                else if (e.dir === 1) { eb.x = e.x+16; eb.y = e.y+40; eb.speedX = 0; eb.speedY = 6; }
                else if (e.dir === 2) { eb.x = e.x; eb.y = e.y+16; eb.speedX = -6; eb.speedY = 0; }
                else { eb.x = e.x+40; eb.y = e.y+16; eb.speedX = 6; eb.speedY = 0; }
                
                let bulletRect = { x: eb.x, y: eb.y, w: 8, h: 8 };
                if (collide(bulletRect, {x: p1.x, y: p1.y, w: 40, h: 40})) {
                    p1.health--;
                    updateUI();
                    if (p1.health <= 0) gameOver = true;
                }
                for (let j = 0; j < bricks.length; j++) {
                    if (collide(bulletRect, bricks[j])) { bricks.splice(j, 1); break; }
                }
            }
        }
        if (enemies.length === 0 && !gameOver && (currentMode === 'bots' || currentMode === 'ctf')) {
            for (let i = 0; i < 3; i++) {
                enemies.push({ x: 100 + i * 250, y: 80, w: 40, h: 40, dir: 1, moveTimer: 0, shootTimer: Math.floor(Math.random() * 50) });
            }
        }
    }
    
    // ========== CTF ==========
    function updateCTF() {
        if (currentMode !== 'ctf') return;
        let flagRect = { x: flag.x, y: flag.y, w: flag.w, h: flag.h };
        let tankRect = { x: p1.x, y: p1.y, w: 40, h: 40 };
        if (!flag.captured && collide(tankRect, flagRect)) {
            flag.captured = true;
            flag.carrier = 'player';
            score += 150;
            updateUI();
        }
        if (flag.captured && flag.carrier === 'player') {
            let baseRect = { x: 50, y: 520, w: 30, h: 30 };
            if (collide(tankRect, baseRect)) {
                score += 500;
                updateUI();
                flag.captured = false;
                flag.carrier = null;
                flag.x = 700;
                flag.y = 80;
            } else {
                flag.x = p1.x + 6;
                flag.y = p1.y + 6;
            }
        }
    }
    
    function sendPosition() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'pos',
                x: p1.x, y: p1.y, dir: p1.dir, health: p1.health
            }));
        }
    }
    
    // ========== ОБНОВЛЕНИЕ ИГРЫ ==========
    function updateGame() {
        if (gameOver || p1.health <= 0) {
            if (p1.health <= 0) gameOver = true;
            return;
        }
        
        if (keys.left) moveTank(p1, -4, 0, 2, true);
        if (keys.right) moveTank(p1, 4, 0, 3, true);
        if (keys.up) moveTank(p1, 0, -4, 0, true);
        if (keys.down) moveTank(p1, 0, 4, 1, true);
        
        if (p1Delay > 0) p1Delay--;
        if (keys.fire && !p1Bullet.active && p1Delay === 0) shoot(p1, p1Bullet, true);
        updateBullet(p1Bullet, true);
        
        if (currentMode === 'pvp' && p2) {
            if (keysP2.left) moveTank(p2, -4, 0, 2, false);
            if (keysP2.right) moveTank(p2, 4, 0, 3, false);
            if (keysP2.up) moveTank(p2, 0, -4, 0, false);
            if (keysP2.down) moveTank(p2, 0, 4, 1, false);
            if (p2Delay > 0) p2Delay--;
            if (keysP2.fire && !p2Bullet.active && p2Delay === 0) shoot(p2, p2Bullet, false);
            updateBullet(p2Bullet, false);
        }
        
        if (currentMode === 'bots' || currentMode === 'ctf') {
            updateEnemies();
        }
        
        if (currentMode === 'ctf') updateCTF();
        
        if (currentMode === 'online' && ws && ws.readyState === WebSocket.OPEN) {
            let now = Date.now();
            if (now - lastSend > 50) {
                sendPosition();
                lastSend = now;
            }
        }
    }
    
    // ========== ОТРИСОВКА ==========
    function draw() {
        ctx.clearRect(0, 0, 800, 600);
        ctx.fillStyle = '#2d2a24';
        ctx.fillRect(0, 0, 800, 600);
        
        for (let b of bricks) {
            ctx.fillStyle = '#b87c3a';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#e6a155';
            ctx.fillRect(b.x+2, b.y+2, b.w-4, 5);
        }
        
        if (currentMode === 'ctf') {
            if (!flag.captured || flag.carrier !== 'player') {
                ctx.fillStyle = '#dc3c2a';
                ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
                ctx.fillStyle = '#ffcc44';
                ctx.font = 'bold 20px monospace';
                ctx.fillText('🏁', flag.x+5, flag.y+22);
            }
            ctx.fillStyle = '#88aa44';
            ctx.fillRect(50, 520, 30, 30);
            ctx.fillStyle = 'gold';
            ctx.fillText('🏠', 57, 542);
        }
        
        let colorIndex = 0;
        const colors = ['#c44f2a', '#2a6ec4', '#c4a42a', '#9e2ac4'];
        for (let [id, player] of players) {
            ctx.fillStyle = colors[colorIndex % colors.length];
            ctx.fillRect(player.x, player.y, 40, 40);
            ctx.fillStyle = '#ffaa66';
            let ex = player.x + 20, ey = player.y + 20;
            if (player.dir === 0) ctx.fillRect(ex-3, player.y-6, 6, 10);
            else if (player.dir === 1) ctx.fillRect(ex-3, player.y+36, 6, 10);
            else if (player.dir === 2) ctx.fillRect(player.x-6, ey-3, 10, 6);
            else ctx.fillRect(player.x+36, ey-3, 10, 6);
            ctx.fillStyle = 'white';
            ctx.font = '12px monospace';
            ctx.fillText('❤️'+player.health, player.x+5, player.y-5);
            colorIndex++;
        }
        
        ctx.fillStyle = '#4f9e32';
        ctx.fillRect(p1.x, p1.y, 40, 40);
        ctx.fillStyle = '#f5d742';
        let cx = p1.x + 20, cy = p1.y + 20;
        if (p1.dir === 0) ctx.fillRect(cx-4, p1.y-8, 8, 12);
        else if (p1.dir === 1) ctx.fillRect(cx-4, p1.y+32, 8, 12);
        else if (p1.dir === 2) ctx.fillRect(p1.x-8, cy-4, 12, 8);
        else ctx.fillRect(p1.x+32, cy-4, 12, 8);
        
        if (currentMode === 'pvp' && p2) {
            ctx.fillStyle = '#c44f2a';
            ctx.fillRect(p2.x, p2.y, 40, 40);
            ctx.fillStyle = '#ffaa66';
            let ex = p2.x + 20, ey = p2.y + 20;
            if (p2.dir === 0) ctx.fillRect(ex-3, p2.y-6, 6, 10);
            else if (p2.dir === 1) ctx.fillRect(ex-3, p2.y+36, 6, 10);
            else if (p2.dir === 2) ctx.fillRect(p2.x-6, ey-3, 10, 6);
            else ctx.fillRect(p2.x+36, ey-3, 10, 6);
            ctx.fillStyle = 'white';
            ctx.font = '12px monospace';
            ctx.fillText('❤️'+p2.health, p2.x+5, p2.y-5);
        }
        
        for (let e of enemies) {
            ctx.fillStyle = '#bd6a32';
            ctx.fillRect(e.x, e.y, 40, 40);
            ctx.fillStyle = '#d17e42';
            let ex = e.x + 20, ey = e.y + 20;
            if (e.dir === 0) ctx.fillRect(ex-3, e.y-6, 6, 10);
            else if (e.dir === 1) ctx.fillRect(ex-3, e.y+36, 6, 10);
            else if (e.dir === 2) ctx.fillRect(e.x-6, ey-3, 10, 6);
            else ctx.fillRect(e.x+36, ey-3, 10, 6);
        }
        
        if (p1Bullet.active) {
            ctx.fillStyle = '#ffcc44';
            ctx.fillRect(p1Bullet.x, p1Bullet.y, 8, 8);
        }
        if (currentMode === 'pvp' && p2Bullet.active) {
            ctx.fillStyle = '#ff6644';
            ctx.fillRect(p2Bullet.x, p2Bullet.y, 8, 8);
        }
        
        if (gameOver || p1.health <= 0) {
            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#f0d890';
            ctx.fillText('GAME OVER', 280, 280);
            ctx.font = '14px monospace';
            ctx.fillStyle = '#c9aa6a';
            ctx.fillText('R - рестарт', 340, 340);
        }
    }
    
    // ========== РЕЖИМЫ ==========
    function startMode(mode) {
        currentMode = mode;
        gameRunning = true;
        let modeText = '';
        if (mode === 'bots') modeText = '🎮 ПРОТИВ БОТОВ';
        if (mode === 'ctf') modeText = '🏁 ЗАХВАТ ФЛАГА';
        if (mode === 'pvp') modeText = '⚔️ PVP 2 ИГРОКА';
        if (mode === 'online') modeText = '🌐 СЕТЕВОЙ РЕЖИМ';
        document.getElementById('modeLabel').innerText = modeText;
        document.getElementById('onlineStatus').innerText = '';
        restart();
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
    }
    
    function exitToMenu() {
        gameRunning = false;
        if (ws) { ws.close(); ws = null; }
        players.clear();
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('game').classList.add('hidden');
        document.getElementById('networkPanel').classList.add('hidden');
    }
    
    // ========== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ==========
    function connectToServer() {
        const ip = document.getElementById('serverIp').value;
        const port = document.getElementById('serverPort').value;
        const url = `ws://${ip}:${port}`;
        
        document.getElementById('netStatus').innerText = `🔄 Подключение к ${ip}:${port}...`;
        
        ws = new WebSocket(url);
        
        ws.onopen = function() {
            document.getElementById('netStatus').innerText = '✅ Подключено! Ожидаем игроков...';
            document.getElementById('networkPanel').classList.add('hidden');
            startMode('online');
        };
        
        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'id') {
                    myId = data.id;
                    document.getElementById('onlineStatus').innerText = `🎮 Ваш ID: ${myId}`;
                }
                if (data.type === 'pos' && data.playerId !== myId) {
                    players.set(data.playerId, {
                        x: data.x, y: data.y, dir: data.dir, health: data.health
                    });
                }
                if (data.type === 'damage' && data.targetId === myId) {
                    p1.health = data.health;
                    updateUI();
                    if (p1.health <= 0) gameOver = true;
                }
                if (data.type === 'disconnect') {
                    players.delete(data.playerId);
                }
                document.getElementById('onlineStatus').innerText = `👥 Игроков: ${players.size + 1}`;
            } catch(e) {}
        };
        
        ws.onerror = function() {
            document.getElementById('netStatus').innerText = '❌ Ошибка! Сервер не запущен. Запусти server.js';
        };
        
        ws.onclose = function() {
            if (gameRunning) {
                document.getElementById('onlineStatus').innerText = '⚠️ Соединение потеряно!';
                setTimeout(function() { exitToMenu(); }, 2000);
            }
        };
    }
    
    // ========== КЛАВИАТУРА ==========
    document.addEventListener('keydown', function(e) {
        if (!gameRunning) return;
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp') keys.up = true;
        if (e.key === 'ArrowDown') keys.down = true;
        if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
        if (currentMode === 'pvp') {
            if (e.key === 'a') keysP2.left = true;
            if (e.key === 'd') keysP2.right = true;
            if (e.key === 'w') keysP2.up = true;
            if (e.key === 's') keysP2.down = true;
            if (e.key === 'x') { keysP2.fire = true; e.preventDefault(); }
        }
        if (e.key === 'r' || e.key === 'R') restart();
        if (e.key === 'Escape') exitToMenu();
    });
    
    document.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp') keys.up = false;
        if (e.key === 'ArrowDown') keys.down = false;
        if (e.key === ' ') { keys.fire = false; }
        if (currentMode === 'pvp') {
            if (e.key === 'a') keysP2.left = false;
            if (e.key === 'd') keysP2.right = false;
            if (e.key === 'w') keysP2.up = false;
            if (e.key === 's') keysP2.down = false;
            if (e.key === 'x') { keysP2.fire = false; }
        }
    });
    
    // ========== ТАЧ-УПРАВЛЕНИЕ (ИСПРАВЛЕННОЕ) ==========
    function setupTouch() {
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnFire = document.getElementById('btnFire');
        const btnRestart = document.getElementById('btnRestart');
        const backBtn = document.getElementById('backBtn');
        
        // Функция для привязки кнопок
        function attachButton(btn, onStart, onEnd) {
            if (!btn) return;
            // Touch события
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                onStart();
            }, { passive: false });
            btn.addEventListener('touchend', function(e) {
                e.preventDefault();
                onEnd();
            }, { passive: false });
            btn.addEventListener('touchcancel', function(e) {
                e.preventDefault();
                onEnd();
            }, { passive: false });
            // Mouse события (для ПК)
            btn.addEventListener('mousedown', function(e) {
                e.preventDefault();
                onStart();
            });
            btn.addEventListener('mouseup', function(e) {
                e.preventDefault();
                onEnd();
            });
            btn.addEventListener('mouseleave', function(e) {
                e.preventDefault();
                onEnd();
            });
        }
        
        attachButton(btnUp, 
            function() { keys.up = true; },
            function() { keys.up = false; }
        );
        attachButton(btnDown,
            function() { keys.down = true; },
            function() { keys.down = false; }
        );
        attachButton(btnLeft,
            function() { keys.left = true; },
            function() { keys.left = false; }
        );
        attachButton(btnRight,
            function() { keys.right = true; },
            function() { keys.right = false; }
        );
        
        // Огонь
        btnFire.addEventListener('touchstart', function(e) {
            e.preventDefault();
            keys.fire = true;
        }, { passive: false });
        btnFire.addEventListener('touchend', function(e) {
            e.preventDefault();
            keys.fire = false;
        }, { passive: false });
        btnFire.addEventListener('touchcancel', function(e) {
            e.preventDefault();
            keys.fire = false;
        }, { passive: false });
        btnFire.addEventListener('mousedown', function(e) {
            e.preventDefault();
            keys.fire = true;
        });
        btnFire.addEventListener('mouseup', function(e) {
            e.preventDefault();
            keys.fire = false;
        });
        btnFire.addEventListener('mouseleave', function(e) {
            e.preventDefault();
            keys.fire = false;
        });
        
        // Рестарт
        btnRestart.addEventListener('click', function(e) {
            e.preventDefault();
            restart();
        });
        btnRestart.addEventListener('touchstart', function(e) {
            e.preventDefault();
            restart();
        }, { passive: false });
        
        // Назад в меню
        backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            exitToMenu();
        });
        backBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            exitToMenu();
        }, { passive: false });
    }
    
    // ========== МЕНЮ ==========
    document.querySelectorAll('.mode-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var mode = this.dataset.mode;
            if (mode === 'online') {
                document.getElementById('networkPanel').classList.toggle('hidden');
                document.getElementById('connectBtn').onclick = connectToServer;
            } else {
                document.getElementById('networkPanel').classList.add('hidden');
                startMode(mode);
            }
        });
    });
    
    // ========== ЗАПУСК ==========
    setupTouch();
    
    function gameLoop() {
        if (gameRunning) {
            updateGame();
            draw();
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
